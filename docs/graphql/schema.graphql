schema {
  query: Query
  mutation: Mutation
}

type Query {
  namespaces(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: NamespaceFilterInput @cost(weight: "10")
    order: [NamespaceSortInput!] @cost(weight: "10")
  ): NamespacesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  namespace(id: ID!): Namespace @cost(weight: "10")
  buckets(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BucketFilterInput @cost(weight: "10")
    order: [BucketSortInput!] @cost(weight: "10")
  ): BucketsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  bucket(id: ID!): Bucket @cost(weight: "10")
  messages(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: MessageFilterInput @cost(weight: "10")
    order: [MessageSortInput!] @cost(weight: "10")
  ): MessagesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  message(id: ID!): Message @cost(weight: "10")
  tags(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: TagFilterInput @cost(weight: "10")
    order: [TagSortInput!] @cost(weight: "10")
  ): TagsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tag(id: ID!): Tag @cost(weight: "10")
  namespaceManagers(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: NamespaceManagerFilterInput @cost(weight: "10")
    order: [NamespaceManagerSortInput!] @cost(weight: "10")
  ): NamespaceManagersConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  bucketAdmins(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BucketAdminFilterInput @cost(weight: "10")
    order: [BucketAdminSortInput!] @cost(weight: "10")
  ): BucketAdminsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  bucketContributors(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BucketContributorFilterInput @cost(weight: "10")
    order: [BucketContributorSortInput!] @cost(weight: "10")
  ): BucketContributorsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  bucketViewers(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BucketViewerFilterInput @cost(weight: "10")
    order: [BucketViewerSortInput!] @cost(weight: "10")
  ): BucketViewersConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tagMessageCounts(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: TagMessageCountFilterInput @cost(weight: "10")
    order: [TagMessageCountSortInput!] @cost(weight: "10")
  ): TagMessageCountsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
}

type Mutation {
  createNamespace(metadata: NamespaceMetadataInput!): Namespace!
    @cost(weight: "10")
  addContributor(namespaceId: BigInt!, bucketId: BigInt!, contributor: String!): BucketContributor!
    @cost(weight: "10")
  removeContributor(
    namespaceId: BigInt!
    bucketId: BigInt!
    contributor: String!
  ): Boolean! @cost(weight: "10")
  addAdmin(namespaceId: BigInt!, bucketId: BigInt!, admin: String!): BucketAdmin!
    @cost(weight: "10")
  removeAdmin(namespaceId: BigInt!, bucketId: BigInt!, admin: String!): Boolean!
    @cost(weight: "10")
  addManager(namespaceId: BigInt!, newManager: String!): NamespaceManager!
    @cost(weight: "10")
  removeManager(namespaceId: BigInt!, oldManager: String!): Boolean!
    @cost(weight: "10")
  createBucket(namespaceId: BigInt!, metadata: BucketMetadataInput!): Bucket!
    @cost(weight: "10")
  pauseWriting(namespaceId: BigInt!, bucketId: BigInt!): Bucket!
    @cost(weight: "10")
  resumeWriting(
    namespaceId: BigInt!
    bucketId: BigInt!
    newEncryptionKey: String!
  ): Bucket! @cost(weight: "10")
  createTag(bucketId: BigInt!, newTag: String!): Tag! @cost(weight: "10")
  rotateKey(namespaceId: BigInt!, bucketId: BigInt!, newEncryptionKey: String!): Bucket!
    @cost(weight: "10")
  write(namespaceId: BigInt!, bucketId: BigInt!, message: MessageInput!): Message!
    @cost(weight: "10")
  forceRemoveNamespace(namespaceId: BigInt!): Boolean! @cost(weight: "10")
  forceRemoveBucket(namespaceId: BigInt!, bucketId: BigInt!): Boolean!
    @cost(weight: "10")
  forceRemoveTag(bucketId: BigInt!, tag: String!): Boolean! @cost(weight: "10")
  forceRemoveMessage(bucketId: BigInt!, messageId: BigInt!): Boolean!
    @cost(weight: "10")
  forceAddManager(namespaceId: BigInt!, manager: String!): NamespaceManager!
    @cost(weight: "10")
  addViewer(namespaceId: BigInt!, bucketId: BigInt!, viewer: String!): BucketViewer!
    @cost(weight: "10")
  removeViewer(namespaceId: BigInt!, bucketId: BigInt!, viewer: String!): Boolean!
    @cost(weight: "10")
}

type Bucket {
  id: ID! @cost(weight: "10")
  bucketId: BigInt!
  namespaceId: BigInt!
  namespace: Namespace! @cost(weight: "10")
  admins: [BucketAdmin!]! @cost(weight: "10")
  contributors: [BucketContributor!]! @cost(weight: "10")
  viewers: [BucketViewer!]! @cost(weight: "10")
  tags: [Tag!]! @cost(weight: "10")
  messages: [Message!]! @cost(weight: "10")
  creator: String
  name: String
  category: String
  properties: String
  isWritable: Boolean!
  encryptionKey: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type BucketAdmin {
  id: ID! @cost(weight: "10")
  bucketIdNumber: BigInt!
  bucket: Bucket! @cost(weight: "10")
  subjectId: String!
  addedAt: DateTime!
}

"A connection to a list of items."
type BucketAdminsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [BucketAdminsEdge!]
  "A flattened list of the nodes."
  nodes: [BucketAdmin!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type BucketAdminsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: BucketAdmin!
}


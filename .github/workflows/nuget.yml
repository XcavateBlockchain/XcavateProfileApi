name: NuGet Publish

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

jobs:
  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    environment: XcavateProfile
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get package version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            VERSION="1.0.${{ github.run_number }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      # Both suites are hermetic — no database, no docker, no running API. They guard what the
      # packages promise: that the payload hash is byte-identical to the Substrate helpers it
      # replaced, and that the Solana package carries no Substrate dependency. A push to NuGet.org
      # cannot be taken back, so this runs before packing.
      - name: Test
        run: |
          dotnet test tests/XcavateBuckets.Tests -c Release
          dotnet test tests/XcavateProfileApiSolanaClient.Tests -c Release

      # Two packages, same version, built from the same sources. XcavateProfileApiSolanaClient omits
      # the Substrate signing path so Solana consumers do not take a dependency on Substrate.NET.API.
      - name: Build packages
        run: |
          for project in XcavateProfileApiClient XcavateProfileApiSolanaClient; do
            dotnet pack "src/${project}/${project}.csproj" \
              -c Release \
              -p:PackageVersion=${{ steps.version.outputs.version }} \
              -o ./nupkgs
          done

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The matching .snupkg symbol packages are pushed alongside each .nupkg automatically.
      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/
          retention-days: 7
